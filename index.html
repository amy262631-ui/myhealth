<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>體質掌控 v8.2.2 (圖示修復版)</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#be185d">
    
    <!-- App Icon 修復 -->
    <!-- 1. 網頁標籤圖示 (使用 SVG 內碼，電腦/Android 瀏覽器用) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧬%3C/text%3E%3C/svg%3E">
    <!-- 2. 手機主畫面圖示 (使用雲端 PNG，iOS 必須用圖片檔) -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/dna-helix.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#be185d', secondary: '#fce7f3', accent: '#9d174d',
                        dark: '#4c0519', cream: '#fff1f2', surface: '#ffffff',
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Playfair+Display:wght@700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #fff1f2;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 120px; /* 預留底部導覽列空間 */
            color: #4c0519;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(120px + env(safe-area-inset-bottom));
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px -3px rgba(190, 24, 93, 0.05);
        }
        .glass-dark {
            background: rgba(76, 5, 25, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-premium:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px -2px rgba(190, 24, 93, 0.15);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Safe Icon Loader ---
        const lucideLib = window.lucide || {};
        const getIcon = (name) => {
            const IconComponent = lucideLib[name];
            return IconComponent ? IconComponent : (props) => <span style={{display:'inline-block', width: props.size||18}} />;
        };
        const Scale = getIcon('Scale');
        const Activity = getIcon('Activity');
        const TrendingUp = getIcon('TrendingUp');
        const RefreshCw = getIcon('RefreshCw');
        const CloudLightning = getIcon('CloudLightning');
        const Sparkles = getIcon('Sparkles');
        const List = getIcon('List'); // 補回列表圖示
        const SafeIcon = ({ icon: Icon, ...props }) => Icon ? <Icon {...props} /> : null;

        // --- Core SVG Icons ---
        const IconDashboard = ({size=24, ...props}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" /></svg>);
        const IconChart = ({size=24, ...props}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>);
        const IconLink = ({size=24, ...props}) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>);

        // --- Logic ---
        const getTrafficLight = (hrv, bhr, sleepTimeStr) => {
            if (!hrv || !bhr) return null;
            const hrvVal = parseFloat(hrv); const bhrVal = parseFloat(bhr);
            let isLateSleep = false;
            if (sleepTimeStr) {
                const [h, m] = sleepTimeStr.split(':').map(Number);
                if ((h === 23 && m >= 30) || (h >= 0 && h < 4)) isLateSleep = true;
            }
            if (hrvVal < 25 || bhrVal > 73 || isLateSleep) return { status: 'red', bg: 'bg-rose-500', text: 'text-white', title: 'Rest & Recover', sub: '強制休息日', desc: '神經系統疲勞或熬夜，請多休息' };
            if (hrvVal > 35 && bhrVal < 70 && !isLateSleep) return { status: 'green', bg: 'bg-emerald-500', text: 'text-white', title: 'Ready to Train', sub: '適合訓練日', desc: '狀態極佳，可重訓 + Zone 2' };
            return { status: 'yellow', bg: 'bg-amber-400', text: 'text-amber-950', title: 'Zone 2 Only', sub: '有氧修復日', desc: '僅限低強度有氧，避免皮質醇堆積' };
        };

        const getCycleInfo = (day) => {
            const d = parseInt(day); if (isNaN(d)) return null;
            if (d >= 1 && d <= 4) return { phase: '易水腫期', hint: '體重虛胖勿焦慮' };
            if (d >= 5 && d <= 7) return { phase: '排水轉折', hint: '水分排出中' };
            if (d >= 8 && d <= 14) return { phase: '黃金燃脂', hint: '效率最高' };
            return { phase: '黃體保養', hint: '代謝高・食慾增' };
        };

        const analyzeComposition = (tbw, weight) => {
            if (!tbw) return null; const w = parseFloat(tbw);
            if (w > 29.2) return { type: 'water', text: '💧 高度水腫', color: 'text-blue-600', bg: 'bg-blue-50' };
            if (w < 28.8) return { type: 'dry', text: '🍂 身體偏乾', color: 'text-amber-600', bg: 'bg-amber-50' };
            return { type: 'ok', text: '✨ 水分標準', color: 'text-emerald-600', bg: 'bg-emerald-50' };
        };

        // --- Chart Component (Optimized Visuals + Data Table) ---
        const ChartView = ({ historyData }) => {
            const canvasRef1 = useRef(null); const canvasRef2 = useRef(null); const canvasRef3 = useRef(null);
            const chartInstance1 = useRef(null); const chartInstance2 = useRef(null); const chartInstance3 = useRef(null);
            const [days, setDays] = useState(14); 

            useEffect(() => {
                const sortedDates = Object.keys(historyData).sort().slice(-days);
                
                // 修正：只取日期部分 (YYYY-MM-DD) 的後 5 碼 (MM-DD)，避免包含時間
                const labels = sortedDates.map(d => d.substring(5, 10).replace('-','/')); 
                
                const weights = sortedDates.map(d => historyData[d].weight);
                const tbws = sortedDates.map(d => historyData[d].tbw);
                const hrvs = sortedDates.map(d => historyData[d].hrv);
                const bhrs = sortedDates.map(d => historyData[d].bhr);
                const bodyFats = sortedDates.map(d => historyData[d].bodyFat);

                const fatMassRaw = weights.map((w, i) => {
                    const bf = parseFloat(bodyFats[i]); const weight = parseFloat(w);
                    return (bf && weight) ? (weight * bf / 100) : null;
                });
                const fatMassTrend = fatMassRaw.map((val, index, arr) => {
                    if (val === null) return null; let sum = 0, count = 0;
                    for (let i = Math.max(0, index - 6); i <= index; i++) { if (arr[i] !== null) { sum += arr[i]; count++; } }
                    return count ? (sum / count) : null;
                });

                // Chart Global Defaults
                Chart.defaults.font.family = "'Noto Sans TC', sans-serif";
                Chart.defaults.color = '#881337';
                Chart.defaults.scale.grid.display = false;

                const destroyCharts = () => {
                    [chartInstance1, chartInstance2, chartInstance3].forEach(ref => { if (ref.current) { ref.current.destroy(); ref.current = null; } });
                };
                destroyCharts();

                // 1. Body Wave (Gradient Style)
                if (canvasRef1.current) {
                    const ctx = canvasRef1.current.getContext('2d');
                    const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
                    gradientFill.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
                    gradientFill.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

                    chartInstance1.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: '體重', data: weights, borderColor: '#be123c', backgroundColor: '#be123c', borderWidth: 2, tension: 0.3 },
                                { label: '體水', data: tbws, borderColor: '#3b82f6', backgroundColor: gradientFill, borderWidth: 1, fill: true, tension: 0.3, pointRadius: 2 }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 6 } } }, 
                            scales: { 
                                x: { display: false }, // 隱藏X軸時間
                                y: { display: true, position: 'left', grid: {color: 'rgba(0,0,0,0.03)'} } 
                            } 
                        }
                    });
                }

                // 2. Real Fat Trend (Bar Gradient Style)
                if (canvasRef3.current) {
                    const ctx = canvasRef3.current.getContext('2d');
                    const barGradient = ctx.createLinearGradient(0, 0, 0, 300);
                    barGradient.addColorStop(0, 'rgba(203, 213, 225, 0.8)');
                    barGradient.addColorStop(1, 'rgba(203, 213, 225, 0.2)');

                    chartInstance3.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { type: 'line', label: '真實趨勢', data: fatMassTrend, borderColor: '#9f1239', borderWidth: 3, tension: 0.4, pointRadius: 0 },
                                { type: 'bar', label: '每日估算', data: fatMassRaw, backgroundColor: barGradient, borderRadius: 4, barThickness: 10 }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { legend: { display: false } }, 
                            scales: { 
                                x: { display: false }, // 隱藏X軸時間
                                y: { display: true, grid: {color: 'rgba(0,0,0,0.03)'} } 
                            } 
                        }
                    });
                }

                // 3. Nervous System
                if (canvasRef2.current) {
                    chartInstance2.current = new Chart(canvasRef2.current, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'HRV', data: hrvs, borderColor: '#10b981', backgroundColor: '#10b981', borderWidth: 2, tension: 0.3 },
                                { label: '心率', data: bhrs, borderColor: '#f43f5e', backgroundColor: '#f43f5e', borderWidth: 1, borderDash: [4, 4], tension: 0.3 }
                            ]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            plugins: { legend: { position: 'top', align: 'end', labels: { usePointStyle: true, boxWidth: 6 } } }, 
                            scales: { 
                                x: { display: false }, // 隱藏X軸時間
                                y: { display: true, grid: {color: 'rgba(0,0,0,0.03)'} } 
                            } 
                        }
                    });
                }
                return () => destroyCharts();
            }, [historyData, days]);

            // Data Table View (恢復此功能)
            const dataTable = useMemo(() => {
                return Object.keys(historyData).sort().reverse().slice(0, days).map(date => ({
                    date, ...historyData[date]
                }));
            }, [historyData, days]);

            return (
                <div className="space-y-6 animate-fade-in pt-4 px-1">
                    <div className="flex justify-center gap-2 mb-4">
                        {[7, 14, 30].map(d => (
                            <button key={d} onClick={() => setDays(d)}
                                className={`px-4 py-1.5 rounded-full text-[10px] font-bold tracking-widest transition-all ${days === d ? 'bg-rose-900 text-white shadow-md' : 'bg-white text-rose-400 border border-rose-100'}`}>
                                {d} DAYS
                            </button>
                        ))}
                    </div>
                    
                    <div className="glass p-5 rounded-[1.5rem] shadow-sm">
                        <div className="flex items-center gap-2 mb-2">
                            <SafeIcon icon={Sparkles} size={16} className="text-rose-500" />
                            <h3 className="text-sm font-bold text-rose-900 tracking-wide">真實體脂趨勢</h3>
                        </div>
                        <div className="h-56"><canvas ref={canvasRef3}></canvas></div>
                        <p className="text-[10px] text-rose-400 mt-2 text-center bg-rose-50 p-1 rounded">忽略灰色長條雜訊，請專注於 <span className="font-bold text-rose-700">深紅線</span> 走向</p>
                    </div>

                    <div className="glass p-5 rounded-[1.5rem] shadow-sm">
                        <h3 className="text-sm font-bold text-rose-900 tracking-wide mb-2">體態波段 (Weight vs Water)</h3>
                        <div className="h-48"><canvas ref={canvasRef1}></canvas></div>
                    </div>

                    <div className="glass p-5 rounded-[1.5rem] shadow-sm">
                        <h3 className="text-sm font-bold text-rose-900 tracking-wide mb-2">神經修復 (HRV vs Heart Rate)</h3>
                        <div className="h-48"><canvas ref={canvasRef2}></canvas></div>
                    </div>

                    {/* 詳細數據列表 (已修復) */}
                    <div className="glass p-5 rounded-[1.5rem] shadow-sm mb-8">
                        <h3 className="text-xs font-bold text-rose-900 tracking-wider uppercase mb-4 flex items-center gap-2">
                            <SafeIcon icon={List} size={14}/> 詳細數據列表
                        </h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-rose-900 text-right">
                                <thead>
                                    <tr className="border-b border-rose-100 text-rose-400">
                                        <th className="pb-2 text-left">日期</th>
                                        <th className="pb-2">體重</th>
                                        <th className="pb-2">體水</th>
                                        <th className="pb-2">HRV</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {dataTable.map(row => (
                                        <tr key={row.date} className="border-b border-rose-50 last:border-0 hover:bg-rose-50/50">
                                            {/* 修正：只取 MM/DD，避免顯示時間 */}
                                            <td className="py-2 text-left font-bold">{row.date.substring(5, 10).replace('-','/')}</td>
                                            <td className="py-2">{row.weight}</td>
                                            <td className="py-2 text-blue-500">{row.tbw}</td>
                                            <td className="py-2 text-emerald-600 font-bold">{row.hrv}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const InputView = ({ today, setToday, data, setData, cycleDay, cycleInfo, traffic, saveData, resetCycle, compAnalysis, isSyncing }) => (
            <div className="space-y-6 animate-fade-in pb-32">
                 {/* Header Card */}
                 <div className="relative overflow-hidden bg-gradient-to-br from-rose-600 via-rose-500 to-pink-600 text-white p-6 pt-10 pb-8 rounded-b-[2.5rem] shadow-xl shadow-rose-500/20 -mx-4 sm:mx-0 sm:rounded-t-[2.5rem]">
                    <div className="relative z-10">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <span className="text-[10px] font-bold tracking-[0.2em] opacity-80 uppercase">Cycle Day</span>
                                <h1 className="text-5xl font-black tracking-tight mt-0" style={{fontFamily: '"Playfair Display", serif'}}>{cycleDay}</h1>
                                <div className="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full mt-2 border border-white/10">
                                    <span className="text-xs font-bold">{cycleInfo.phase}</span>
                                    <span className="text-[10px] opacity-80 border-l border-white/30 pl-2">{cycleInfo.hint}</span>
                                </div>
                            </div>
                            <div className="flex flex-col items-end gap-3">
                                <input type="date" value={today} onChange={(e) => setToday(e.target.value)}
                                    className="bg-black/20 backdrop-blur-sm text-white text-[10px] font-bold px-3 py-1.5 rounded-lg border-none outline-none text-right w-24" />
                                <button onClick={resetCycle} className="text-[10px] bg-white text-rose-600 px-3 py-1.5 rounded-full font-bold shadow-sm hover:scale-105 transition-transform flex items-center gap-1">
                                    <SafeIcon icon={RefreshCw} size={10} /> MC Reset
                                </button>
                            </div>
                        </div>
                        {traffic ? (
                            <div className={`glass-dark p-4 rounded-2xl flex items-center justify-between border-l-4 ${traffic.status === 'red' ? 'border-l-rose-400' : (traffic.status === 'green' ? 'border-l-emerald-400' : 'border-l-amber-400')}`}>
                                <div>
                                    <p className="text-[10px] font-bold opacity-60 uppercase tracking-widest text-rose-100">Advisor</p>
                                    <p className="font-bold text-lg">{traffic.title}</p>
                                    <p className="text-[10px] opacity-80">{traffic.sub}</p>
                                </div>
                                <div className="text-right max-w-[50%]">
                                    <p className="text-xs font-medium leading-relaxed opacity-90">{traffic.desc}</p>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-black/10 backdrop-blur-sm p-4 rounded-2xl text-center text-white/60 text-xs">等待數據...</div>
                        )}
                    </div>
                </div>

                <div className="px-2 sm:px-0 space-y-5">
                    <div className="glass p-5 rounded-[2rem]">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-2">
                                <div className="p-2 bg-rose-100 rounded-full text-rose-600"><SafeIcon icon={Scale} size={16} /></div>
                                <h2 className="text-sm font-bold text-rose-950 uppercase tracking-wide">Composition</h2>
                            </div>
                            {compAnalysis && <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${compAnalysis.bg} ${compAnalysis.color}`}>{compAnalysis.text}</span>}
                        </div>
                        <div className="grid grid-cols-3 gap-3">
                            <NumberInput label="體重" unit="kg" value={data.weight} onChange={v => setData({...data, weight: v})} placeholder="--" />
                            <NumberInput label="體脂率" unit="%" value={data.bodyFat} onChange={v => setData({...data, bodyFat: v})} placeholder="--" />
                            <NumberInput label="體水重" unit="kg" value={data.tbw} onChange={v => setData({...data, tbw: v})} placeholder="--" />
                        </div>
                    </div>
                    <div className="glass p-5 rounded-[2rem]">
                        <div className="flex items-center gap-2 mb-4">
                             <div className="p-2 bg-rose-100 rounded-full text-rose-600"><SafeIcon icon={Activity} size={16} /></div>
                            <h2 className="text-sm font-bold text-rose-950 uppercase tracking-wide">Nervous System</h2>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <NumberInput label="HRV" unit="ms" value={data.hrv} onChange={v => setData({...data, hrv: v})} placeholder="--" step="1" />
                            <NumberInput label="靜止心率" unit="bpm" value={data.bhr} onChange={v => setData({...data, bhr: v})} placeholder="--" step="1" />
                        </div>
                        <div className="relative">
                             <label className="text-[10px] font-bold text-rose-300 uppercase tracking-widest pl-1 mb-1 block">入睡時間</label>
                             <input type="time" value={data.sleepTime} onChange={(e) => setData({...data, sleepTime: e.target.value})}
                                className="w-full bg-white border border-rose-100 rounded-2xl px-4 py-3 text-base font-bold text-rose-900 outline-none focus:border-rose-300 focus:ring-4 focus:ring-rose-50 transition-all input-premium" />
                        </div>
                    </div>
                    <div className="glass p-5 rounded-[2rem]">
                        <div className="flex items-center gap-2 mb-4">
                            <div className="p-2 bg-rose-100 rounded-full text-rose-600"><SafeIcon icon={TrendingUp} size={16} /></div>
                            <h2 className="text-sm font-bold text-rose-950 uppercase tracking-wide">Cardio (Zone 2)</h2>
                        </div>
                         <div className="flex items-center gap-3">
                            <div className="flex-1">
                                <input type="number" inputMode="decimal" value={data.zone2} onChange={(e) => setData({...data, zone2: e.target.value})} placeholder="0"
                                    className="w-full bg-white border border-rose-100 rounded-2xl px-4 py-4 text-xl font-bold text-rose-900 outline-none focus:border-rose-300 focus:ring-4 focus:ring-rose-50 transition-all input-premium" />
                            </div>
                            <span className="text-rose-400 font-bold text-xs uppercase">Minutes</span>
                         </div>
                    </div>
                </div>
                
                <button onClick={saveData} disabled={isSyncing}
                    className={`w-full py-4 rounded-2xl font-bold text-sm tracking-widest shadow-xl shadow-rose-900/20 flex items-center justify-center gap-2 active:scale-95 transition-all mb-4
                    ${isSyncing ? 'bg-gray-400 text-white' : 'bg-rose-900 text-white'}`}>
                    {isSyncing ? <div className="spinner"></div> : <SafeIcon icon={CloudLightning} size={16} />}
                    {isSyncing ? 'SYNCING...' : 'SAVE DATA'}
                </button>
            </div>
        );

        const NumberInput = ({ label, value, onChange, unit, placeholder, step="0.1" }) => (
            <div className="flex flex-col gap-1.5">
                <label className="text-[10px] font-bold text-rose-300 uppercase tracking-widest pl-1">{label}</label>
                <div className="relative group">
                    <input type="number" inputMode="decimal" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} step={step}
                        className="w-full bg-white border border-rose-100 rounded-2xl px-3 py-3 text-lg font-bold text-rose-900 outline-none focus:border-rose-300 focus:ring-4 focus:ring-rose-50 transition-all input-premium placeholder-rose-100" />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-rose-300 pointer-events-none">{unit}</span>
                </div>
            </div>
        );

        
        // Helper to get local date string YYYY-MM-DD
        // (新增這個函式：用來強制抓取手機當地的年月日，而不是 UTC 時間)
        const getLocalToday = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const App = () => {
            const [view, setView] = useState('input');
            
            // (修改這裡：將原本的 new Date().toISOString()... 改成 getLocalToday())
            const [today, setToday] = useState(getLocalToday()); 
            
            const [settings, setSettings] = useState(() => {
                const s = localStorage.getItem('ht_v4_settings'); 
                const defaultUrl = 'https://script.google.com/macros/s/AKfycbx49ZIG4Ht79xFffN9ZSejKcrBNuVp61MGdEByGiPGIg6pVa3xU0yL_ZZfSioYASfXc/exec';
                if (s) {
                    const parsed = JSON.parse(s);
                    if (!parsed.sheetUrl) return { ...parsed, sheetUrl: defaultUrl };
                    return parsed;
                }
                // (修改這裡：將原本的 new Date().toISOString()... 改成 getLocalToday())
                return { periodStartDate: getLocalToday(), sheetUrl: defaultUrl }; 
            });
            const [data, setData] = useState({ weight: '', bodyFat: '', tbw: '', hrv: '', bhr: '', sleepTime: '', zone2: '' });
            const [isSyncing, setIsSyncing] = useState(false);
            const [historyData, setHistoryData] = useState({});
            const [showConfig, setShowConfig] = useState(false);

            const cycleDay = useMemo(() => {
                const start = new Date(settings.periodStartDate);
                const current = new Date(today);
                const diffTime = current - start;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            }, [today, settings.periodStartDate]);

            useEffect(() => {
                const hist = JSON.parse(localStorage.getItem('ht_v4_history') || '{}');
                setHistoryData(hist);
                if (hist[today]) setData(hist[today]);
                else setData({ weight: '', bodyFat: '', tbw: '', hrv: '', bhr: '', sleepTime: '', zone2: '' });
            }, [today]);

            // ✨ 自動同步邏輯 (保留您提供的版本)
            useEffect(() => {
                const fetchCloudData = async () => {
                    if (!settings.sheetUrl) return;
                    try {
                        console.log("正在同步雲端資料...");
                        const response = await fetch(settings.sheetUrl); // 呼叫 doGet
                        const dataArray = await response.json();

                        if (Array.isArray(dataArray)) {
                            const cloudHistory = {};
                            dataArray.forEach(item => {
                                if (item.date) cloudHistory[item.date] = item;
                            });
                            setHistoryData(prev => ({...prev, ...cloudHistory}));
                            const currentLocal = JSON.parse(localStorage.getItem('ht_v4_history') || '{}');
                            const mergedData = { ...currentLocal, ...cloudHistory };
                            localStorage.setItem('ht_v4_history', JSON.stringify(mergedData));
                            if (cloudHistory[today]) {
                                setData(cloudHistory[today]);
                                console.log("已自動填入今日雲端資料");
                            }
                        }
                    } catch (e) {
                        console.error("雲端同步失敗:", e);
                    }
                };
                fetchCloudData();
            }, []);

            const saveData = async () => {
                const hist = JSON.parse(localStorage.getItem('ht_v4_history') || '{}');
                const payload = { ...data, cycleDay, date: today };
                const newHist = { ...hist, [today]: payload };
                localStorage.setItem('ht_v4_history', JSON.stringify(newHist));
                setHistoryData(newHist);
                if (settings.sheetUrl) {
                    setIsSyncing(true);
                    try {
                        // 使用 text/plain 繞過 CORS
                        await fetch(settings.sheetUrl, { 
                            method: 'POST', 
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'text/plain' }, 
                            body: JSON.stringify(payload) 
                        });
                        alert('✨ 記錄與備份成功！');
                    } catch (e) { alert('⚠️ 本機成功，雲端失敗'); } finally { setIsSyncing(false); }
                } else { alert('✨ 記錄成功'); }
            };

            const resetCycle = () => {
                if(confirm(`確定今天 (${today}) 是月經第一天？`)) {
                    const newSettings = {...settings, periodStartDate: today};
                    setSettings(newSettings);
                    localStorage.setItem('ht_v4_settings', JSON.stringify(newSettings));
                }
            };

            const traffic = getTrafficLight(data.hrv, data.bhr, data.sleepTime);
            const cycleInfo = getCycleInfo(cycleDay);
            const compAnalysis = analyzeComposition(data.tbw, data.weight);

            return (
                <div className="max-w-md mx-auto min-h-screen relative overflow-y-auto shadow-2xl bg-[#fff1f2]">
                    <div className="p-4 sm:px-6 z-10 relative">
                        {view === 'input' ? (
                            <InputView 
                                today={today} setToday={setToday} data={data} setData={setData}
                                cycleDay={cycleDay} cycleInfo={cycleInfo} traffic={traffic}
                                saveData={saveData} resetCycle={resetCycle} compAnalysis={compAnalysis}
                                isSyncing={isSyncing}
                            />
                        ) : (
                            <ChartView historyData={historyData} />
                        )}
                    </div>

                    {/* Fixed Bottom Nav (穩定版) */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-rose-100 z-30 px-6 py-3 safe-area-pb">
                        <div className="flex justify-around items-center max-w-md mx-auto">
                            <button onClick={() => setView('input')} 
                                className={`flex flex-col items-center gap-1 transition-colors ${view === 'input' ? 'text-rose-700' : 'text-rose-300'}`}>
                                <IconDashboard size={24} />
                                <span className="text-[10px] font-bold tracking-wide">TODAY</span>
                            </button>
                            
                            <button onClick={() => setView('chart')} 
                                className={`flex flex-col items-center gap-1 transition-colors ${view === 'chart' ? 'text-rose-700' : 'text-rose-300'}`}>
                                <IconChart size={24} />
                                <span className="text-[10px] font-bold tracking-wide">TRENDS</span>
                            </button>

                            <button onClick={() => setShowConfig(!showConfig)} 
                                className={`flex flex-col items-center gap-1 transition-colors ${showConfig ? 'text-rose-700' : 'text-rose-300'}`}>
                                <IconLink size={24} />
                                <span className="text-[10px] font-bold tracking-wide">SYNC</span>
                            </button>
                        </div>
                    </div>

                    {showConfig && (
                        <div className="fixed inset-0 bg-rose-900/30 backdrop-blur-sm z-40 flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg text-rose-900 mb-4">Google Sheet Link</h3>
                                <input type="text" value={settings.sheetUrl} 
                                    onChange={(e) => { const newS = {...settings, sheetUrl: e.target.value}; setSettings(newS); localStorage.setItem('ht_v4_settings', JSON.stringify(newS)); }}
                                    placeholder="API URL..."
                                    className="w-full p-4 bg-rose-50 border border-rose-100 rounded-2xl mb-4 text-xs outline-none focus:border-rose-300 transition-colors text-rose-700" />
                                <button onClick={() => setShowConfig(false)} className="w-full bg-rose-900 text-white py-4 rounded-2xl font-bold text-sm tracking-wide shadow-lg shadow-rose-900/20">DONE</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
